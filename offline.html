<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - La Dolce Vita</title>
    <meta name="description" content="You are currently offline. Please check your connection to continue your journey with La Dolce Vita.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .offline-page {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .offline-icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 2rem;
            opacity: 0.5;
        }
        .offline-page h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 1.5rem;
        }
        .offline-page p {
            max-width: 500px;
            margin: 0 auto 2.5rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body class="page-loaded">
    <header class="site-header">
        <nav class="nav">
            <a href="index.html" class="nav__logo">
                <i class="fas fa-utensils nav__logo-icon"></i>
                La Dolce Vita
            </a>
        </nav>
    </header>

    <main id="main">
        <section class="offline-page">
            <div class="container">
                <div class="offline-icon">
                    <i class="fas fa-wifi-slash"></i>
                </div>
                <h1>A Moment of Silence</h1>
                <p>It seems your connection has wandered off. Please check your network to continue your culinary journey with us.</p>
                <button onclick="window.location.reload()" class="btn btn--primary">Try Again</button>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="site-footer__bottom">
                <p class="site-footer__copy">&copy; 2026 La Dolce Vita. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
