<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — La Dolce Vita</title>
    <meta name="description" content="Complete your order at La Dolce Vita.">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/" defer></script>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <header class="site-header">
        <nav class="nav">
            <a href="index.html" class="nav__logo">
                <i class="fas fa-utensils nav__logo-icon"></i>
                La Dolce Vita
            </a>
            <div class="nav__links">
                <a href="index.html" class="nav__link">Experience</a>
                <a href="menu.html" class="nav__link">Menu</a>
                <a href="order.html" class="nav__link nav__link--active">Order</a>
                <a href="reservations.html" class="nav__link nav__cta">Reserve</a>
            </div>
            <button class="nav__toggle" aria-label="Open menu">
                <span class="nav__toggle-line"></span>
                <span class="nav__toggle-line"></span>
                <span class="nav__toggle-line"></span>
            </button>
        </nav>
    </header>

    <div class="mobile-menu">
        <a href="index.html" class="mobile-menu__link">Experience</a>
        <a href="menu.html" class="mobile-menu__link">Menu</a>
        <a href="order.html" class="mobile-menu__link">Order</a>
        <a href="reservations.html" class="mobile-menu__link">Reserve</a>
    </div>

    <main id="main">
        <section class="page-hero">
            <div class="page-hero__bg">
                <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1920&q=80" alt="Checkout" loading="eager" fetchpriority="high">
            </div>
            <div class="page-hero__overlay"></div>
            <div class="page-hero__content">
                <span class="label">Checkout</span>
                <h1>Complete Your Order</h1>
                <p>Secure payment powered by Stripe.</p>
            </div>
        </section>

        <section class="section">
            <div class="container container--narrow">
                <div class="checkout-flow">
                    <div class="checkout-summary">
                        <h3>Order Summary</h3>
                        <div id="checkout-items"></div>
                        <div class="checkout-total">
                            <span>Total</span>
                            <span id="checkout-total-amount">$0.00</span>
                        </div>
                    </div>

                    <form id="checkout-form" class="checkout-form">
                        <h3>Delivery Details</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="checkout-name">Full Name</label>
                                <input type="text" id="checkout-name" required placeholder="Your name">
                            </div>
                            <div class="form-group">
                                <label for="checkout-phone">Phone</label>
                                <input type="tel" id="checkout-phone" required placeholder="(555) 123-4567">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="checkout-address">Delivery Address</label>
                            <input type="text" id="checkout-address" required placeholder="Street address">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="checkout-city">City</label>
                                <input type="text" id="checkout-city" required placeholder="City">
                            </div>
                            <div class="form-group">
                                <label for="checkout-zip">ZIP Code</label>
                                <input type="text" id="checkout-zip" required placeholder="00000">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="checkout-notes">Special Instructions</label>
                            <textarea id="checkout-notes" rows="3" placeholder="Allergies, delivery instructions..."></textarea>
                        </div>

                        <div class="checkout-divider"></div>

                        <h3>Payment</h3>
                        <div id="stripe-element" class="stripe-element">
                            <!-- Stripe Card Element mounts here -->
                        </div>
                        <div id="card-errors" class="card-errors" role="alert"></div>

                        <button type="submit" class="btn btn--primary btn--full btn--lg" id="submit-checkout">
                            <span class="btn-text">Pay Now</span>
                            <span class="btn-loading" style="display:none;">Processing...</span>
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="site-footer__bottom">
                <p class="site-footer__copy">&copy; 2026 La Dolce Vita. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="js/checkout.js"></script>
</body>
</html>
