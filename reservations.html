    <main>
        <section class="page-header">
            <div class="container">
                <h1>Book Your Table</h1>
                <p>Join us for an unforgettable dining experience.</p>
            </div>
        </section>

        <section class="reservation-page">
            <div class="container">
                <div class="reservation-form-container">
                    <form id="reservation-form">
                        <div class="form-group">
                            <label for="res-name">Full Name</label>
                            <input type="text" id="res-name" name="res-name" required placeholder="Your Name">
                        </div>
                        <div class="form-group">
                            <label for="res-email">Email Address</label>
                            <input type="email" id="res-email" name="res-email" required placeholder="Your Email">
                        </div>
                        <div class="form-group">
                            <label for="res-date">Date</label>
                            <input type="date" id="res-date" name="res-date" required>
                        </div>
                        <div class="form-group">
                            <label for="res-time">Time</label>
                            <select id="res-time" name="res-time" required>
                                <option value="" disabled selected>Select Time</option>
                                <option value="17:00">5:00 PM</option>
                                <option value="18:00">6:00 PM</option>
                                <option value="19:00">7:00 PM</option>
                                <option value="20:00">8:00 PM</option>
                                <option value="21:00">9:00 PM</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="res-guests">Number of Guests</label>
                            <input type="number" id="res-guests" name="res-guests" min="1" max="20" required value="2">
                        </div>
                        <div class="form-group">
                            <label for="res-phone">Phone Number</label>
                            <input type="tel" id="res-phone" name="res-phone" required placeholder="(555) 123-4567">
                        </div>
                        <div class="form-group full-width">
                            <label for="res-requests">Special Requests</label>
                            <textarea id="res-requests" name="res-requests" rows="3" placeholder="Allergies, birthdays, or specific table preference..."></textarea>
                        </div>
                        <button type="submit" class="btn-primary">Confirm Reservation</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
